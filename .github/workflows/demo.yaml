name: Demos

# Plays the lessons and examples as demo scenarios with a2a-serve's scripted
# test agent, so that a change to a command or its output that a lesson shows
# fails here. See tools/demo/README.md.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'lessons/**'
      - 'examples/**'
      - 'tools/demo/**'
      - '.github/workflows/demo.yaml'

  pull_request:
    branches: [ "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'lessons/**'
      - 'examples/**'
      - 'tools/demo/**'
      - '.github/workflows/demo.yaml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - home
          - 01-first-message
          - 02-configuration
          - 03-messages-and-tasks
          - 04-conversations
          - 05-credentials
          - scripting-with-jq
          - credential-helper
          - a2a-hello
          - a2a-transport-echo
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: a2a-cli

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: a2aproject/a2a-serve
        path: a2a-serve

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: a2a-serve/go.mod
        cache-dependency-path: |
          a2a-cli/go.sum
          a2a-serve/go.sum

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y tmux

    - name: Play ${{ matrix.scenario }}
      working-directory: a2a-cli
      run: tools/demo/record.sh ${{ matrix.scenario }} --fake --no-record --speed 20
