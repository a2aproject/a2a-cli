# One-off, manually-triggered workflow to sign the Microsoft CLA on a
# winget-pkgs PR as the bot account, using the A2A_BOT_PAT secret that already
# lives in CI.
#
# The Microsoft CLA only needs to be agreed to ONCE per account: after a2a-bot
# agrees, future winget/homebrew PRs from it skip the Needs-CLA gate. Once this
# has run successfully the file will be deleted.
name: winget-cla-agree (one-off)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number in microsoft/winget-pkgs"
        required: true
        default: "431906"
      company:
        description: "Legal entity for the CLA"
        required: true
        default: "Linux Foundation"
      confirm:
        description: "Type AGREE to confirm posting the (legally binding) CLA agreement"
        required: true
        default: ""

permissions: {}

jobs:
  agree:
    runs-on: ubuntu-latest
    steps:
      - name: Guard on confirmation
        if: ${{ inputs.confirm != 'AGREE' }}
        run: |
          echo "::error::Set the 'confirm' input to AGREE to post the CLA agreement. Aborting."
          exit 1

      - name: Post CLA agreement comment as a2a-bot
        env:
          GH_TOKEN: ${{ secrets.A2A_BOT_PAT }}
          PR: ${{ inputs.pr_number }}
          COMPANY: ${{ inputs.company }}
        run: |
          set -euo pipefail
          body="@microsoft-github-policy-service agree company=\"${COMPANY}\""
          echo "Posting to microsoft/winget-pkgs#${PR}:"
          echo "  ${body}"
          resp="$(jq -n --arg b "$body" '{body: $b}' \
            | gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/microsoft/winget-pkgs/issues/${PR}/comments" \
                --input -)"
          echo "Posted comment: $(printf '%s' "$resp" | jq -r '.html_url')"
