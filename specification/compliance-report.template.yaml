# a2a-cli compliance report — machine-readable template
#
# Companion to COMPLIANCE.md (see its Appendix A). The Markdown registry is
# CANONICAL; this file is the same measurement in machine form — the single,
# self-contained artifact a tool links from the A2A compatibility matrix.
#
# HOW TO USE
#   1. Copy this file into your tool's repository.
#   2. Fill the `report:` identity block.
#   3. For every requirement below, set `status:` (pass | partial | fail |
#      not_measured | na) and a `note:` for anything that is not `pass`.
#   4. Fill `default_001_breakdown:`, `error_codes:`, `attestation:`.
#   5. Recompute `summary:` from the requirement statuses (aggregator step).
#
# FAIL-CLOSED (COMPLIANCE.md Appendix A.3) — a broken/empty report is NEVER a pass:
#   - Every requirement ID for the claimed tier AND every lower tier MUST be
#     present. A missing key, an empty `requirements:`, or all-`not_measured`
#     rolls up to `satisfied: false`.
#   - Only `pass` (and a genuine `na`) satisfies a tier. `partial` / `fail` /
#     `not_measured` / any unrecognized value block it — never skipped.
#   - `designation` is ALWAYS `conformant`; "official" is never self-asserted.
#   - `A2ACLI_DEFAULT_001: pass` is invalid unless every default_001_breakdown
#     row is shipped:yes AND overridable:yes.
#
# PUBLICATION: this file is public. Placeholders only — no secrets, no
# internal-only URLs in any `note`/`evidence`.

report:
  tool: <tool-name>
  tool_version: <x.y.z>
  language: <Go | Rust | Python | ...>
  repository: <url>
  maintainer: <name or org>
  report_date: <YYYY-MM-DD>          # when this report was produced
  spec_version: "0.2"                # SPEC.md "Version"
  spec_revision: <YYYY-MM-DD>        # SPEC.md "Last updated" — needed to interpret Draft results
  a2a_versions: ["1.0"]
  agent_tested: <name or URL>
  agent_tck_conformant: unknown      # yes | no | unknown
  transports_covered: []             # subset of [HTTP+JSON, JSON-RPC, gRPC]
  tier_claimed: <1 | 2 | 3>
  designation: conformant            # ALWAYS "conformant"

# Aggregator-produced. Recompute from the statuses below; do not hand-wave.
summary:
  tier_1: {total: 37, pass: 0, partial: 0, fail: 0, not_measured: 37, na: 0, satisfied: false}
  tier_2: {total: 15, pass: 0, partial: 0, fail: 0, not_measured: 15, na: 0, satisfied: false}
  tier_3: {total: 12, pass: 0, partial: 0, fail: 0, not_measured: 12, na: 0, satisfied: false}

