# DEFAULT_001 passes only when every row is shipped:yes AND overridable:yes.
default_001_breakdown:
  transport_server_preference_order: {shipped: no, overridable: no, note: null}
  task_completion_wait_by_default:   {shipped: no, overridable: no, note: null}
